# Rule: net revenue split by the is_weekend flag. Golden defines weekend as
# Sat/Sun; verify it matches dim_dates.is_weekend at baseline. Dimension aliased
# to the view name (dates_is_weekend). Two rows.
name: net_revenue_weekend_vs_weekday
prompt: What is net revenue split by weekend versus weekday?
sql: |
  SELECT
    CASE WHEN DAYNAME(f.ordered_date) IN ('Sat', 'Sun') THEN TRUE ELSE FALSE END AS dates_is_weekend,
    SUM(f.net_revenue) AS net_revenue
  FROM ANALYTICS.MARTS.FCT_ORDER_ITEMS f
  GROUP BY dates_is_weekend
  ORDER BY dates_is_weekend
