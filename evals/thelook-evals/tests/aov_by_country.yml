# Rule: average order value (order grain) by customer country (join dim_users).
# Dimension aliased to the view name (users_country). Multi-row: ORDER BY.
name: aov_by_country
prompt: What is the average order value by customer country?
sql: |
  SELECT
    u.country AS users_country,
    SUM(f.net_revenue) / NULLIF(COUNT(DISTINCT f.order_id), 0) AS avg_order_value
  FROM ANALYTICS.MARTS.FCT_ORDER_ITEMS f
  JOIN ANALYTICS.MARTS.DIM_USERS u ON f.user_id = u.user_id
  GROUP BY u.country
  ORDER BY u.country
