# Rule: volume return rate by category (count-based), which diverges from the
# value-weighted rate. Decimal fraction. Dimension aliased to the view name
# (products_category). Multi-row: ORDER BY.
name: volume_return_rate_by_category
prompt: What is the volume return rate by product category (share of line items returned), as a decimal fraction?
sql: |
  SELECT
    p.category AS products_category,
    SUM(CASE WHEN f.is_returned THEN 1 ELSE 0 END)
      / NULLIF(COUNT(*), 0) AS volume_return_rate
  FROM ANALYTICS.MARTS.FCT_ORDER_ITEMS f
  JOIN ANALYTICS.MARTS.DIM_PRODUCTS p ON f.product_id = p.product_id
  GROUP BY p.category
  ORDER BY p.category
