# Rule: aggregation-level margin rate (SUM/SUM, never a row average) filtered to
# 2024. Decimal fraction. Scalar.
name: gross_margin_rate_2024
prompt: What is the overall gross margin rate in 2024, as a decimal fraction?
sql: |
  SELECT SUM(gross_margin) / NULLIF(SUM(net_revenue), 0) AS gross_margin_rate
  FROM ANALYTICS.MARTS.FCT_ORDER_ITEMS
  WHERE YEAR(ordered_date) = 2024
