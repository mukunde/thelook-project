tables:
  finance:
    table: public.finance
    columns:
      - name: count
        type: number
        nullable: false
        descriptions:
          db: Total number of item lines across orders, including returned items.
      - name: net_revenue
        type: number
        nullable: false
        descriptions:
          db: |
            Total revenue from items sold. Returned items count as zero, so this is
            the actual money the business kept.
      - name: gross_margin_rate
        type: number
        nullable: false
        descriptions:
          db: |
            Profit margin as a percentage of revenue. A 30% rate means we keep
            30 cents of profit on every euro earned, after paying for the items.
      - name: financial_return_rate
        type: number
        nullable: false
        descriptions:
          db: |
            Share of sales (in euros) that customers returned. A 5% rate means
            5 cents of every euro sold came back as a return.
      - name: avg_order_value
        type: number
        nullable: false
        descriptions:
          db: |
            Average revenue per order. Answers "how much does a typical customer
            spend in a single order, all items combined?"
      - name: gross_revenue
        type: number
        nullable: false
        descriptions:
          db: |
            Total sales value before accounting for returns (SUM of sale_price,
            returned items included at their original price).
      - name: gross_margin
        type: number
        nullable: false
        descriptions:
          db: |
            Total profit after item costs (SUM of per-line gross_margin,
            net_revenue minus cost).
      - name: returned_revenue
        type: number
        nullable: false
        descriptions:
          db: |
            Sales value lost to returns (SUM of sale_price for returned items
            only). Numerator of financial_return_rate.
      - name: order_item_id
        type: number
      - name: order_id
        type: number
      - name: status
        type: string
      - name: ordered_date
        type: time
      - name: delivered_date
        type: time
      - name: is_returned
        type: boolean
      - name: is_delivered
        type: boolean
      - name: products_category
        type: string
      - name: products_brand
        type: string
      - name: products_department
        type: string
      - name: users_country
        type: string
      - name: users_state
        type: string
      - name: users_gender
        type: string
      - name: users_traffic_source
        type: string
      - name: orders_status
        type: string
      - name: dates_year
        type: number
      - name: dates_year_month
        type: string
        descriptions:
          db: YYYY-MM format (e.g., 2024-07).
      - name: dates_year_quarter
        type: string
        descriptions:
          db: YYYY-Qn format (e.g., 2024-Q3).
      - name: dates_is_weekend
        type: boolean
      - name: __user
        type: string
        descriptions:
          db: Virtual column for security context switching
      - name: __cubeJoinField
        type: string
        descriptions:
          db: Virtual column for joining cubes
    descriptions:
      db: |
        Finance domain BI surface. Exposes the 4 canonical Finance measures
        (net_revenue, gross_margin_rate, financial_return_rate, avg_order_value)
        along with a curated set of dimensions for cohorting (time, geography,
        product taxonomy, order status).
