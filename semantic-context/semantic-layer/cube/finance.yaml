# Semantic-layer overlay for the `finance` source.
#
# Two-tier architecture (KTX loader):
#   - The scanned schema manifest (_schema/public.yaml, auto-generated by
#     `ktx scan cube`) owns the table binding and the column inventory.
#   - This overlay adds what a scan cannot know: the grain, the predefined
#     measures, reusable segments, and visibility curation.
#
# Measure design (see ADR-0013 and wiki/global/finance-conventions.md):
#   - The columns of `public.finance` are projections of Cube measures; a
#     plain SUM over the additive ones (net_revenue, gross_revenue,
#     gross_margin, returned_revenue) is rollup-safe at any granularity
#     because Cube re-aggregates them from the order-item grain.
#   - Ratio measures are recomposed here FROM THOSE SAME additive
#     components, never by averaging the row-level rate columns (a
#     classic fan-out/weighting error). The rate columns from Cube are
#     hidden below for that reason.

name: finance

grain:
  - order_item_id

column_overrides:
  # ─── Identifiers: usable in expressions, not surfaced as dimensions ───
  - name: order_item_id
    visibility: internal
  - name: order_id
    visibility: internal

  # ─── Additive components: consumed via the predefined measures below ───
  - name: net_revenue
    visibility: internal
  - name: gross_revenue
    visibility: internal
  - name: gross_margin
    visibility: internal
  - name: returned_revenue
    visibility: internal

  # ─── Pre-aggregated rate columns from Cube: hidden on purpose ───
  # Averaging these row-level/pre-grouped rates produces incorrect
  # results when re-grouping. Agents must use the predefined ratio
  # measures instead, which recompose from additive sums.
  - name: count
    visibility: hidden
  - name: gross_margin_rate
    visibility: hidden
  - name: financial_return_rate
    visibility: hidden
  - name: avg_order_value
    visibility: hidden

  # ─── Cube SQL API virtual columns: never relevant to agents ───
  - name: __user
    visibility: hidden
  - name: __cubeJoinField
    visibility: hidden

  # ─── Time dimension role ───
  - name: ordered_date
    role: time

measures:
  # ─── Additive measures (rollup-safe at any granularity) ───
  - name: total_net_revenue
    expr: sum(net_revenue)
    description: |
      Net revenue: total revenue from items sold, returned items count as
      zero. The canonical Finance revenue measure (defined once in the dbt
      mart fct_order_items, propagated through Cube unchanged).

  - name: total_gross_revenue
    expr: sum(gross_revenue)
    description: |
      Gross sales value before returns: SUM of sale_price including
      returned items at their original price. Denominator of the
      financial return rate.

  - name: total_gross_margin
    expr: sum(gross_margin)
    description: |
      Total profit after item costs (net revenue minus cost, summed).

  - name: total_returned_revenue
    expr: sum(returned_revenue)
    description: |
      Sales value lost to returns (sale_price of returned lines only).
      Numerator of the financial return rate.

  - name: order_count
    expr: count_distinct(order_id)
    description: |
      Number of distinct orders. Denominator of average order value
      (note: NOT the line-item count).

  - name: item_count
    expr: count(order_item_id)
    description: |
      Number of order line items, including returned ones.

  # ─── Ratio measures (recomposed from the additive components) ───
  - name: gross_margin_rate
    expr: sum(gross_margin) / nullif(sum(net_revenue), 0)
    description: |
      Profit margin as a share of net revenue, computed at the aggregation
      level: SUM(gross_margin) / SUM(net_revenue). A 0.30 rate means 30
      cents of profit per euro of net revenue. Never averaged from
      row-level rates (small orders would weigh as much as large ones).

  - name: financial_return_rate
    expr: sum(returned_revenue) / nullif(sum(gross_revenue), 0)
    description: |
      Share of gross sales value (in euros) lost to returns. The
      numerator uses the original sale_price of returned items because
      their net_revenue is zero by construction. A 0.05 rate means 5
      cents of every euro sold came back as a return.

  - name: avg_order_value
    expr: sum(net_revenue) / nullif(count_distinct(order_id), 0)
    description: |
      Average net revenue per distinct order: how much a typical customer
      spends in a single order, all items combined. Cross-grain measure
      (numerator at line grain, denominator at order grain), so it cannot
      be expressed as a plain average over rows.

segments:
  - name: not_returned
    expr: is_returned = false
    description: Excludes returned order lines.

  - name: delivered
    expr: is_delivered = true
    description: Only order lines that were actually delivered.
