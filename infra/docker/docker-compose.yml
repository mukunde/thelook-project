# Always-on stack for the OCI VM.
#
# Design notes:
#   - Only Caddy exposes ports to the host (80/443). Everything else is on
#     internal networks, reachable only through Caddy.
#   - Metabase has its own Postgres for the application metadata DB, kept
#     in a separate "metabase" internal network from "edge" so Caddy is
#     the single ingress.
#   - Named volumes (not bind mounts) for easier backup via rclone.
#   - Image tags pinned to majors; review before bumping.
#
# Scope: this stack focuses on the Caddy + Metabase pair for Jalon A.5
# (self-service BI on top of Cube semantic layer). Dagster orchestration
# (Jalon A.3) will be added back in a follow-up PR when orchestration/
# code lands; the workspace + image set is intentionally absent here to
# avoid running services with no payload.

name: thelook

networks:
  edge:
    # Caddy <-> public-facing services
    driver: bridge
  metabase:
    # Metabase <-> its postgres
    driver: bridge
    internal: true

volumes:
  caddy_data:
  caddy_config:
  metabase_postgres_data:
  metabase_data:

services:
  # ── Reverse proxy + TLS ────────────────────────────────
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      METABASE_DOMAIN: ${METABASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    networks:
      - edge

  # ── Metabase ────────────────────────────────────────────
  metabase-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${METABASE_DB_USER}
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}
      POSTGRES_DB: ${METABASE_DB_NAME}
    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data
    networks:
      - metabase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METABASE_DB_USER} -d ${METABASE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    # Multi-arch (linux/amd64 + linux/arm64) image. Metabase started officially
    # shipping ARM64 manifests in v0.51.x; pinning to v0.52.10 ensures the OCI
    # ARM A1 host runs the image natively instead of through QEMU emulation
    # (which makes initial DB migrations 10x slower and pegs the CPU).
    image: metabase/metabase:v0.52.10
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-postgres
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_DBNAME: ${METABASE_DB_NAME}
      MB_SITE_URL: https://${METABASE_DOMAIN}
      # Metabase needs the reverse-proxied host to generate correct URLs.
      MB_ADMIN_EMAIL: ${ACME_EMAIL}
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      metabase-postgres:
        condition: service_healthy
    networks:
      - metabase
      - edge
